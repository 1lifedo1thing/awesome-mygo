name: Announce on X and to the project

# Every app, plugin, UI library or state management solution a push to main adds (a new file in packages/catalog/data/apps, plugins, ui or state; a renamed one is not new) is posted to X with packages/announce, as a post of its own with the entry's page on the site as its only link, so X shows the page's card: what was listed and by whom (the owner's X account when their GitHub profile names one), its summary, its stars and how much the site lists now. Each entry is a job of its own, one at a time, so re-running the failed jobs of a run posts only what was not posted. Each job waits for the site to list the entry before it posts, since Workers Builds deploys main on its own. After the post, the job opens an issue on the project's own GitHub repository saying it was listed, with its page on the site, the post on X and the README badge's Markdown to link back (packages/announce/src/issue.ts); a repository is told once, and not at all when its issues are off, it is archived or it belongs to this site's owner. Run it by hand to post entries again, to see their posts and issues without posting or opening them, or with issue_only to open just the issues of entries announced before the workflow opened any.
#
# Secrets: X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN and X_ACCESS_SECRET, the OAuth 1.0a keys of an X app with read and write permission, the access token generated for the account that posts. Without them nothing is posted, and the issue goes without a post. NOTIFY_GITHUB_TOKEN, a classic personal access token with the public_repo scope of the account the issues come from: neither this workflow's token nor a GitHub App's can open an issue on a repository they are not installed on. Without it the issues are only printed.

on:
  push:
    branches: [main]
    paths:
      - packages/catalog/data/apps/*.json
      - packages/catalog/data/plugins/*.json
      - packages/catalog/data/ui/*.json
      - packages/catalog/data/state/*.json
  workflow_dispatch:
    inputs:
      entries:
        description: Entries to post, space-separated, as paths under packages/catalog/data (e.g. ui/8bitmygoui.json apps/bamboo.json); with issue_only, a path may end in =<its post on X> for the issue to link to
        required: true
      dry_run:
        description: Only print the posts and the issues
        type: boolean
        default: true
      issue_only:
        description: Open only the issues, without posting, for entries announced before issues were opened
        type: boolean
        default: false

# No concurrency group: GitHub keeps one pending run per group and cancels the one before, so of three merges in a row the middle one's entries would never be posted. Runs of different pushes post side by side; a run's own entries still go one at a time.

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-latest
    outputs:
      entries: ${{ steps.find.outputs.entries }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: find
        env:
          BEFORE: ${{ github.event.before }}
          INPUT: ${{ inputs.entries }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            list=$(tr -s ' \t' '\n' <<< "$INPUT")
          else
            list=$(git diff --name-only --diff-filter=A -M "$BEFORE" "$GITHUB_SHA" -- 'packages/catalog/data/apps/*.json' 'packages/catalog/data/plugins/*.json' 'packages/catalog/data/ui/*.json' 'packages/catalog/data/state/*.json' | sed 's#^packages/catalog/data/##')
          fi
          entries=$(jq -Rnc '[inputs | select(length > 0)]' <<< "$list")
          echo "Entries: $entries"
          # A push that adds more than a handful is a reorganization of the data, like the one that gave every entry a file of its own, not a batch of new listings.
          if [[ "$GITHUB_EVENT_NAME" == push && $(jq length <<< "$entries") -gt 5 ]]; then
            echo "::error::This push adds $(jq length <<< "$entries") entries, more than 5, so none is posted. Run the workflow by hand with the ones that are new."
            exit 1
          fi
          echo "entries=$entries" >> "$GITHUB_OUTPUT"

  post:
    needs: find
    if: needs.find.outputs.entries != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.find.outputs.entries) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @awesome-mygo/announce
      - name: Post ${{ matrix.entry }} and tell its project
        env:
          ENTRY: ${{ matrix.entry }}
          DRY_RUN: ${{ inputs.dry_run }}
          ISSUE_ONLY: ${{ inputs.issue_only }}
          GITHUB_TOKEN: ${{ github.token }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          NOTIFY_GITHUB_TOKEN: ${{ secrets.NOTIFY_GITHUB_TOKEN }}
        run: pnpm --filter @awesome-mygo/announce announce "$ENTRY"
